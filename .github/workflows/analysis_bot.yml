name: Hive Daily Analysis Bot

on:
  schedule:
    - cron: '0 10 * * *'   # Her gün saat 10:00 UTC
  workflow_dispatch:

jobs:
  run-analysis-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Analysis Bot
        env:
          HIVE_USERNAME: ${{ secrets.HIVE_USERNAME }}
          HIVE_POSTING_KEY: ${{ secrets.HIVE_POSTING_KEY }}
        run: python analysis_bot.py
